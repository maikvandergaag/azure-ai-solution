name: Validate Terraform
run-name: "Validate - ${{ github.event.pull_request.title || github.ref_name }}"

# Runs on every pull request that touches Terraform.
#
# validate  Formatting and configuration checks. No Azure access needed.
# plan      A read-only speculative plan for development against the real state so reviewers see
#           what the change would do. Reads OIDC variables from the matching GitHub environment;
#           the plan is written to the run summary. Nothing changes.

on:
    pull_request:
        paths:
            - "infra/terraform/**"
            - ".github/workflows/validate-terraform.yml"
            - ".github/workflows/deploy-azure.yml"
    workflow_dispatch:

permissions:
    contents: read

# A newer push to the same PR supersedes the running validation.
concurrency:
    group: validate-terraform-${{ github.ref }}
    cancel-in-progress: true

env:
    TERRAFORM_WORKING_DIR: infra/terraform/app
    TERRAFORM_VERSION: 1.16.4

jobs:
    validate:
        name: Format and validate
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Terraform fmt
              run: terraform fmt -check -recursive -diff infra/terraform

            # -backend=false: validate needs providers and modules but not state, so no Azure
            # credentials are required for this job.
            - name: Terraform Init (no backend)
              working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
              run: terraform init -input=false -backend=false

            - name: Terraform Validate
              working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
              run: terraform validate

    terraform-plan:
        name: Speculative plan Development
        needs: validate
        runs-on: ubuntu-latest
        # Reuses the OIDC variables of the deploy workflow's environments.
        environment: Development
        permissions:
            id-token: write
            contents: read
        env:
            TF_IN_AUTOMATION: true
            ARM_USE_OIDC: true
            ARM_USE_AZUREAD: true
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            TF_STATE_SUBSCRIPTION_ID: ${{ vars.TF_STATE_SUBSCRIPTION_ID }}
            TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
            TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
            TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
            TERRAFORM_VAR_FILE: environment/dev.tfvars
            TF_STATE_KEY: ibex-infra-dev.tfstate
            TARGET_ENVIRONMENT: Development
            TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            TF_VAR_webui_secret_key: ${{ secrets.WEBUI_SECRET_KEY }}
            TF_VAR_certificate_pfx_base64: ${{ secrets.CERTIFICATE_PFX_BASE64 }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check environment configuration
              run: |
                  set -euo pipefail
                  missing=()
                  [ -n "$ARM_CLIENT_ID" ]       || missing+=("AZURE_CLIENT_ID")
                  [ -n "$ARM_TENANT_ID" ]       || missing+=("AZURE_TENANT_ID")
                  [ -n "$ARM_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")
                  [ -n "$TF_STATE_SUBSCRIPTION_ID" ] || missing+=("TF_STATE_SUBSCRIPTION_ID")
                  [ -n "$TF_STATE_RESOURCE_GROUP" ] || missing+=("TF_STATE_RESOURCE_GROUP")
                  [ -n "$TF_STATE_STORAGE_ACCOUNT" ] || missing+=("TF_STATE_STORAGE_ACCOUNT")
                  [ -n "$TF_STATE_CONTAINER" ] || missing+=("TF_STATE_CONTAINER")
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Environment '$TARGET_ENVIRONMENT' is missing variables: ${missing[*]}."
                    exit 1
                  fi
                  if [ ! -f "$TERRAFORM_WORKING_DIR/$TERRAFORM_VAR_FILE" ]; then
                    echo "::error::$TERRAFORM_WORKING_DIR/$TERRAFORM_VAR_FILE does not exist."
                    exit 1
                  fi

            - name: Azure login
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Terraform Init
              working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
              run: |
                  terraform init -input=false \
                    -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
                    -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
                    -backend-config="container_name=$TF_STATE_CONTAINER" \
                    -backend-config="key=$TF_STATE_KEY" \
                    -backend-config="subscription_id=$TF_STATE_SUBSCRIPTION_ID" \
                    -backend-config="use_azuread_auth=true" \
                    -backend-config="use_oidc=true"

            # -lock=false: a PR plan is read-only and must never hold the state lock; a concurrent
            # deploy run owns locking.
            - name: Terraform Plan
              id: plan
              working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
              run: |
                  set -euo pipefail
                  # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
                  status=0
                  terraform plan -input=false -lock=false -var-file="$TERRAFORM_VAR_FILE" -out=tfplan -detailed-exitcode || status=$?
                  case "$status" in
                    0) has_changes=false ;;
                    2) has_changes=true ;;
                    *) exit "$status" ;;
                  esac
                  echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

            - name: Publish plan summary
              working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
              env:
                  HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
              run: |
                  set -euo pipefail
                  terraform show -no-color tfplan > plan.txt
                  summary_line="$(grep -E '^(Plan:|No changes\.)' plan.txt | tail -n 1 || true)"
                  {
                    echo "## Terraform plan - $TARGET_ENVIRONMENT (speculative)"
                    echo
                    echo "**${summary_line:-See the full plan below.}**"
                    echo
                    echo "Read-only PR plan: nothing will be changed."
                    echo
                    echo "<details><summary>Full plan</summary>"
                    echo
                    echo '```'
                    # The step summary is capped at 1 MiB.
                    head -c 900000 plan.txt
                    echo '```'
                    echo "</details>"
                  } >> "$GITHUB_STEP_SUMMARY"
                  rm -f plan.txt tfplan
